idth:0;width:100%}.compact{width:auto;max-width:100%}.stat{font-size:2rem;font-weight:750;display:block}.pill{color:#315943;background:#ebf3e9;border-radius:20px;padding:4px 9px;font-size:.82rem}.thumb{display:block;width:100%;height:220px;object-fit:contain;background:#edf1eb;border-radius:10px}.empty{padding:16px;border:1px dashed #c2d0c4;border-radius:10px}.hidden{display:none}dialog{width:min(570px,calc(100vw - 24px));max-height:90vh;border:1px solid var(--line);border-radius:20px;padding:22px;color:var(--ink)}dialog::backdrop{background:#142d27aa}#notice{position:fixed;bottom:16px;right:16px;max-width:calc(100% - 32px);background:#234b3d;color:#fff;border-radius:12px;padding:10px 14px}a{color:#286146}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.55rem;border-bottom:1px solid var(--line)}@media(max-width:650px){.wrap{padding:0 14px}.grid{grid-template-columns:1fr}.nav{gap:4px}.nav button{padding:.55rem}.card{padding:15px}.thumb{height:155px}}

.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#def2c5;color:#234b3d;font-size:22px;line-height:1}

<style>

.section-banner::after{content:"";position:absolute;z-index:-1;right:-45px;top:-96px;width:275px;aspect-ratio:1;border:1px solid #ffffff26;border-radius:50%;box-shadow:0 0 0 22px #ffffff0c,0 0 0 47px #ffffff0a}

.section-symbol{display:grid;place-items:center;flex:none;width:clamp(44px,10vw,80px);aspect-ratio:1;border-radius:20px;background:#e7f3d7;color:#244d40;font-size:clamp(1.5rem,5vw,2.7rem);font-weight:700}

@media(max-width:650px){.section-banner{min-height:145px}.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.nav button{padding:.58rem .2rem;font-size:.8rem}.section-symbol{border-radius:14px}}
</style>
<style>

<style>

body:has(#login:not([hidden])){min-height:100dvh;background:linear-gradient(115deg,#142f26f2,#244e3fe3 58%,#2d5146cc),var(--pulso-photo) center 46%/cover fixed}
.login-layout{border:1px solid #a8b4af;background:#f4f7f5;box-shadow:0 20px 58px #10251e74}
.login-card input{background:#fff;border-color:#a7b5ae}
.login-card .password-field button{background:#e8eeeb;border-color:#a7b5ae}
.login-card .primary{background:#285640;border-color:#285640}
</style>
<style>.access-status{margin:0;padding:.6rem .75rem;border-radius:9px;background:#fff0e7;color:#733619}</style>
</head>
<body>
<section id="intro" hidden aria-label="Bienvenida"><div class="intro-content"><div class="brand-mark intro-logo" aria-hidden="true"></div><h1 id="welcome">¡Bienvenido!</h1><p class="intro-name">Pulso Vital</p><p>Cuida tu salud. Avanza a tu ritmo.</p><div class="load-track" aria-hidden="true"><div class="load-fill"></div></div></div></section>
<section id="login" class="wrap login-shell" hidden></section><div id="app" hidden><header><div class="wrap top"><div class="brand"><span class="brand-mark" aria-hidden="true"></span> Pulso <strong>Vital</strong></div><div class="row account-actions"><button type="button" data-action="intro" hidden>Ver inicio</button><button type="button" data-action="logout">Cerrar sesión</button></div></div></header>
<div class="wrap"><nav class="nav" aria-label="Secciones" id="nav"></nav><main id="main"></main></div>
</div><dialog id="dialog"></dialog><div id="notice" role="status" hidden></div>
<script>
'use strict';
const main = document.querySelector('#main');
const dialog = document.querySelector('#dialog');
const notice = document.querySelector('#notice');
const nav = document.querySelector('#nav');
const intro = document.querySelector('#intro');
const app = document.querySelector('#app');
const login = document.querySelector('#login');
let introTimer;
function finishIntro() {
  clearTimeout(introTimer);
  intro.classList.add('leaving');
  introTimer = setTimeout(()=>{
    intro.hidden = true;
    app.inert = false;
    login.inert = false;
    login.classList.remove('waiting-for-intro');
    if(login.hidden) nav.querySelector('[aria-current=true]')?.focus();
    else login.querySelector('input')?.focus();
  }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300);
}
function showIntro() {
  clearTimeout(introTimer);
  const name = state.profile.name?.trim().split(/\s+/)[0];
  document.querySelector('#welcome').textContent = name ? '¡Bienvenido, '+name+'!' : '¡Bienvenido!';
  intro.classList.remove('leaving');
  intro.hidden = false;
  app.inert = true;
  login.inert = true;
  if(!login.hidden) login.classList.add('waiting-for-intro');
  introTimer = setTimeout(finishIntro,3200);
}
const meals = {'Desayuno':'07:30','Media mañana':'10:30','Almuerzo':'13:00','Media tarde':'16:00','Merienda':'19:30'};
const measured = ['Cintura','Pecho / tórax','Brazo derecho','Muslo derecho','Cuello'];
const poses = ['Frente','Espalda','Perfil izquierdo','Perfil derecho'];
const sections = ['Hoy','Programa','Progreso','Ficha','Clientes','Ayuda'];
const catalogue = {
  'Pan integral':247,'Jamón de pavo':110,'Huevo cocido':155,'Verde cocido':116,'Queso fresco':270,
  'Pollo cocido':165,'Arroz cocido':130,'Frijol cocido':127,'Lenteja cocida':116,'Aguacate':160,
  'Ensalada sin aderezo':20,'Yogur natural':60,'Almendras':579,'Café negro':2
};
const food = (name, grams) => ({name, grams, density: catalogue[name] ?? null});
const bread = [
  {...food('Pan integral Supan',null), portion:'3 rebanadas'},
  food('Jamón de pavo',50),
  {...food('Huevo cocido',null), portion:'3 unidades'},
  {...food('Café negro',null), portion:'1 taza de café negro o aromática sin azúcar', spoken:'una taza de café negro o una aromática sin azúcar'}
];
const green = [
  food('Verde cocido',250),
  {...food('Huevo cocido',null), portion:'2 unidades'},
  food('Queso fresco',30),
  {...food('Café negro',null), portion:'1 taza de café negro o aromática sin azúcar', spoken:'una taza de café negro o una aromática sin azúcar'}
];
const snack = [food('Yogur Toni Light',200),food('Almendras',30)];
const plate = avocado => [food('Pollo cocido',200),food('Arroz cocido',300),food('Aguacate',avocado),food('Ensalada sin aderezo',null)];
const menus = {
  A:{'Desayuno':bread,'Almuerzo':plate(100),'Merienda':plate(80)},
  B:{'Desayuno':bread,'Almuerzo':plate(80),'Media tarde':snack,'Merienda':plate(50)},
  C:{'Desayuno':green,'Almuerzo':plate(80),'Media tarde':snack,'Merienda':plate(50)},
  D:{'Almuerzo':plate(120),'Media tarde':snack,'Merienda':plate(100)}
};
const routines = [
  ['Lunes · Torso','Press banca',4,8,180,'https://www.youtube.com/shorts/wLayV1XggbM'],
  ['Miércoles · Pierna','Sentadilla hack',4,10,180,'https://www.youtube.com/shorts/itmlCUc0P3k'],
  ['Viernes · Cuerpo completo','Peso muerto rumano',4,8,180,'https://www.youtube.com/shorts/8qNrTuZ0rXM']
];
const blank = () => ({days:{}, week:{}, notes:[], profile:{}, reminder:''});
const params = new URLSearchParams(location.search);
const demo = params.has('demo');
const closedScreen = params.has('cerrada');
if(!demo && !closedScreen && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
const clientsKey = demo ? 'pulso-clientes-demo' : 'pulso-clientes';
const accessKey=clientsKey+':access';
const sessionKey=clientsKey+':session';
function readAccounts() {
  try {return JSON.parse(localStorage.getItem(accessKey)) || {};}
  catch {return {};}
}
let accounts=readAccounts();
let account;
try { account=accounts[sessionStorage.getItem(sessionKey)]; } catch {}

let clients = [];
try { clients = JSON.parse(localStorage.getItem(clientsKey)) || []; } catch {}
let client = clients.find(item=>item.id===params.get('cliente'));
const personalKey = demo ? 'mi-programa-demo-v1' : 'mi-programa-v1';
const clientKey = id => clientsKey+':'+id;
const photosKey = id => id ? clientKey(id)+':fotos' : demo?'mi-programa-fotos-demo':'mi-programa-fotos';
let storageKey = client ? clientKey(client.id) : personalKey;
let state = blank();
try { state = {...state,...JSON.parse(localStorage.getItem(storageKey))}; } catch {}
const dateKey = (date = new Date()) => [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
const parseDate = key => new Date(key+'T12:00:00');
const shift = (key, delta) => {const date = parseDate(key); date.setDate(date.getDate()+delta); return dateKey(date);};
const monday = key => shift(key,-((parseDate(key).getDay()+6)%7));
const pretty = key => parseDate(key).toLocaleDateString('es-EC',{weekday:'long',day:'numeric',month:'long'});
if (demo && !client && state.demoRevision !== 2) {
  const todayKey = dateKey();
  state.profile = {name:'Alex',height:170,sleep:7,objective:'Organizar mis hábitos durante la semana.'};
  state.week[todayKey] = 'B';
  state.days[todayKey] = {weight:75,water:500};
  /* LOCAL_DEMO */
  state.demoRevision = 2;
  save();
}
const requestedPage = params.get('vista');
let page = sections.includes(requestedPage) ? requestedPage : 'Hoy';
let clientFilter = '';
const requestedDate = params.get('fecha');
let selected = /^\d{4}-\d{2}-\d{2}$/.test(requestedDate || '') && !isNaN(parseDate(requestedDate)) ? requestedDate : dateKey();
let comparison = '';
let reportRange='week';
let reportComparison='';
let videoTimer;
let activeDictation;
let lastNotice;
let renderVersion = 0;
const day = (key = selected) => state.days[key] ?? {};
const editDay = (key = selected) => state.days[key] ??= {};
const menuChoice = (key = selected) => state.week[key] || '';
const plan = (key = selected) => menus[menuChoice(key)] || {};
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const number = value => value === '' || value == null ? null : Number(value);
const format = value => new Intl.NumberFormat('es-EC',{maximumFractionDigits:1}).format(value);
const calories = item => item.grams == null || item.density == null ? null : item.grams*item.density/100;
function intake(record) {
  const items = Object.values(record.entries || {}).flatMap(entry => entry.items || []);
  const known = items.map(calories).filter(value => value != null);
  const amount=known.reduce((sum,value)=>sum+value,0);
  return {total:known.length ? format(amount) : '—',amount,missing:items.length-known.length};
}
function save() {
  try {localStorage.setItem(storageKey,JSON.stringify(state));}
  catch {notify('El navegador no pudo guardar los datos.'); return false;}
  return true;
}
function notify(message) {
  notice.textContent = message;
  notice.hidden = false;
  clearTimeout(lastNotice);
  lastNotice = setTimeout(()=>notice.hidden=true,4000);
}
function update(message) {const saved = save(); render(); if (saved && message) notify(message);}
function speak(message) {
  notify(message);
  if (!('speechSynthesis' in window)) return;
  const utterance = new SpeechSynthesisUtterance(message);
  const voices = speechSynthesis.getVoices();
  const voice = voices.find(voice=>voice.lang.toLowerCase()==='es-ec')
    || voices.find(voice=>/^es[-_](419|mx|co|us)$/i.test(voice.lang))
    || voices.find(voice=>/^es\b/i.test(voice.lang));
  if (voice) utterance.voice = voice;
  utterance.lang = voice?.lang || 'es-EC';
  utterance.rate = 0.94;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}
const action = (label, command, arg='', css='') => `<button type="button" class="${css}" data-action="${command}" data-arg="${esc(arg)}">${label}</button>`;
const dateField = `<label class="compact">Fecha<input id="selected" type="date"></label>`;
const menuOptions = choice => `<option value="">Elegir opción</option>${Object.keys(menus).map(key=>`<option ${key===choice?'selected':''}>${key}</option>`).join('')}`;
function describe(items) {
  return items?.map(item=>`${item.portion ? item.portion+' ('+item.name+')' : item.name+(item.grams == null ? ' al gusto' : ' · '+item.grams+' g')}`).join(', ') || '';
}
function spokenMeal(items) {
  return new Intl.ListFormat('es-EC',{type:'conjunction'}).format(items.map(item=>{
    if (item.spoken) return item.spoken;
    if (item.portion?.includes('rebanadas')) return item.portion+' de '+item.name.toLowerCase();
    if (item.portion?.includes('unidades')) return item.portion.replace(' unidades','')+' huevos cocidos';
    return item.grams == null ? item.name.toLowerCase()+' al gusto' : item.grams+' gramos de '+item.name.toLowerCase();
  }));
}
function reminderMessage(name) {
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches';
  const firstName = state.profile.name?.trim().split(/\s+/)[0];
  const items = plan()[name];
  const text = items?.length
    ? 'Te recuerdo que, según tu plan de hoy, es hora de tu '+name.toLowerCase()+'. Tenías programado '+spokenMeal(items)+'. Si comiste lo que estaba en el menú, toca el visto para confirmarlo. Si cambiaste algún alimento, toca la equis y cuéntame qué comiste. Puedes quitar lo que dejaste, agregar lo que comiste y ajustar los gramos.'
    : 'Te recuerdo que es hora de registrar tu '+name.toLowerCase()+'. Abre el registro para agregar los alimentos y las cantidades que comiste. Si omitiste esta comida, también puedes marcarlo aquí.';
  return greeting+(firstName?', '+firstName:'')+'. Qué gusto acompañarte. '+text;
}
function today() {
  const record = day();
  const totals = intake(record);
  return `<section class="hero"><div class="hero-content"><p>${esc(pretty(selected))}${demo?" · Demo personal":""}</p><h1>Tu plan de hoy</h1><p>Consulta tu menú y registra lo que hiciste.</p>${action('▶ Probar aviso hablado','speak')}</div><div class="hero-photo" aria-hidden="true"></div></section>
  <div class="grid"><div><section class="card"><div class="row between"><h2>Alimentación</h2>${dateField}</div>
  <label class="compact">Menú del día<select id="menu">${menuOptions(menuChoice())}</select></label>
  ${Object.entries(meals).map(([name,time])=>{
    const entry = record.entries?.[name];
    const scheduled = plan()[name];
    return `<div class="meal"><div class="row between"><h3>${name}</h3><span class="pill">${entry?.status || (scheduled?'Pendiente':'Sin programar')}</span></div>
    <small>${time}${scheduled ? ' · '+esc(describe(scheduled)) : ''}</small>
    ${entry?.items?.length ? `<p>${esc(describe(entry.items))}</p>` : ''}
    <div class="row meal-buttons">${scheduled?action('✓ Comí lo planeado','confirm',name):''}${action(entry?'Editar registro':scheduled?'✕ Cambiar u omitir':'Registrar comida','meal',name)}</div></div>`;
  }).join('')}</section></div>
  <aside>${state.dailyReminders?.length?`<section class="card"><h2>Recordatorios</h2>${state.dailyReminders.map(item=>`<div class="meal"><h3>${esc(item.time)} · ${esc(item.kind)}</h3><p>${esc(item.label)}</p><small>${esc(record.reminderAnswers?.[item.id] || 'Sin respuesta')}</small></div>`).join('')}</section>`:''}<section class="card"><h2>Agua</h2><strong class="stat">${format(record.water ?? 0)} ml</strong>
  <div class="row">${action('+250 ml','water',250)}${action('+500 ml','water',500)}${action('Editar','water-edit')}</div></section>
  <section class="card"><h2>Calorías registradas</h2><strong class="stat">${totals.total} kcal</strong><small>Estimadas con los alimentos registrados.${totals.missing?` ${totals.missing} ingrediente(s) con datos pendientes.`:''}</small></section>
  <section class="card"><form id="weight" class="stack"><h2>Peso del día</h2><label>Kilogramos<input name="weight" type="number" min="1" max="700" step="0.1" value="${esc(record.weight)}" required></label><button class="primary">Guardar peso</button></form></section></aside></div>`;
}

  return `<section class="section-banner ${kind} help-cover"><div><h1>${title}</h1><p>${description}</p></div><img src="${coverImages[kind]}" alt="${photoDescription}" width="720" height="405"></section>`;

function programme() {
  const first = monday(selected);
  return `${sectionBanner('planning','Plan semanal','Elige tus menús y prepara las sesiones de la semana.','Calendario semanal rodeado de verduras y comidas preparadas')}<div class="card"><div class="row between"><h2>Menús de la semana</h2>${dateField}</div><p class="muted">Menús de ejemplo del primer mes. B y C incluyen media tarde. D empieza en el almuerzo.</p>
  <div class="fields">${Array.from({length:7},(_,i)=>{
    const key=shift(first,i);
    return `<label>${esc(pretty(key))}<select data-menu-date="${key}">${menuOptions(menuChoice(key))}</select></label>`;
  }).join('')}</div></div>
  <section class="card"><h2>Entrenamiento de ejemplo</h2><p class="muted">Registro del ${esc(pretty(selected))}. Usa el selector de fecha de arriba para cambiar de día.</p><div class="stack">${routines.map(([title,exercise,sets,reps,rest,url],index)=>`<div class="meal"><h3>${title}</h3><p>${exercise} · ${sets} series de ${reps} · ${rest/60} min de descanso</p><div class="row"><a href="${url}" target="_blank" rel="noopener noreferrer">Ver video</a>${action('Iniciar descanso','timer',rest)}${action(day().training?.[index]?'✓ Realizado · Desmarcar':'Marcar realizado','training',index)}${action(day().training?.[index]?.alternative?'Editar ejercicio realizado':'Hice otro ejercicio','training-alternative',index)}</div>${day().training?.[index]?.alternative?`<p>Ejercicio realizado: <strong>${esc(day().training[index].alternative)}</strong></p>`:''}</div>`).join('')}</div><p id="timer" role="status"></p></section>`;
}
const ranges={day:'Un día',week:'Una semana',compare:'Comparar semanas',month:'4 semanas',two:'2 meses',four:'4 meses'};
function datesBetween(start,end) {
  const list=[];
  for(let key=start;key<=end;key=shift(key,1)) list.push(key);
  return list;
}
function reportDates() {
  if(reportRange==='day') return [selected];
  if(reportRange==='week'||reportRange==='compare') return datesBetween(monday(selected),shift(monday(selected),6));
  if(reportRange==='month') return datesBetween(shift(selected,-27),selected);
  const start=parseDate(selected);
  const originalDay=start.getDate();
  start.setDate(1);
  start.setMonth(start.getMonth()-(reportRange==='two'?2:4));
  start.setDate(Math.min(originalDay,new Date(start.getFullYear(),start.getMonth()+1,0).getDate()));
  return datesBetween(dateKey(start),selected);
}
function weightChart(dates,compare=[]) {
  const series=[dates,compare].map(list=>list.flatMap((key,index)=>day(key).weight==null?[]:[{key,index,weight:day(key).weight}]));
  const values=series.flat().map(point=>point.weight);
  if(!values.length) return '<p class="muted">Guarda un peso en Hoy para empezar el gráfico.</p>';
  const low=Math.floor(Math.min(...values))-1, high=Math.ceil(Math.max(...values))+1;
  const x=i=>dates.length===1?195:39+i*322/(dates.length-1);
  const y=value=>130-(value-low)*100/(high-low);
  const colors=['#267459','#7550a5'];
  const labels=dates.length<=7?dates.map((_,i)=>i):[0,Math.floor((dates.length-1)/2),dates.length-1];
  return `<svg viewBox="0 0 390 160" class="weight-chart" role="img" aria-label="Evolución del peso">
    <path d="M39 30V130H361" fill="none" stroke="#b8cdbf"/>
    <text x="2" y="34" font-size="10">${high} kg</text><text x="2" y="128" font-size="10">${low} kg</text>
    ${series.map((points,i)=>`<polyline points="${points.map(point=>x(point.index)+','+y(point.weight)).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="3" ${i?'stroke-dasharray="5 4"':''}/>
    ${points.map(({key,index,weight})=>`<circle cx="${x(index)}" cy="${y(weight)}" r="${dates.length>28?2:4}" fill="${colors[i]}"><title>${esc(pretty(key))} · ${format(weight)} kg</title></circle>${values.length<=7?`<text x="${x(index)}" y="${y(weight)-9}" text-anchor="middle" font-size="10">${format(weight)}</text>`:''}`).join('')}`).join('')}
    ${labels.map(i=>`<text x="${x(i)}" y="151" text-anchor="middle" font-size="9">${esc(parseDate(dates[i]).toLocaleDateString('es-EC',dates.length===7?{weekday:'short'}:{day:'numeric',month:'short'}))}</text>`).join('')}
  </svg>`;
}
function dayReview(key) {
  const record=day(key), total=intake(record), goals=state.reportGoals||{};
  const yesterday=day(shift(key,-1)).weight;
  const change=record.weight!=null&&yesterday!=null?Math.round((record.weight-yesterday)*10)/10:null;
  const training=Object.values(record.training||{}).filter(Boolean);
  const scheduled=[1,3,5].includes(parseDate(key).getDay());
  const caloriesText=total.total==='—'?'Sin calorías calculadas':total.missing
    ?total.total+' kcal parciales · '+total.missing+' ingrediente(s) pendiente(s)'
    :total.total+' kcal estimadas'+(goals.calories?' · '+(total.amount>goals.calories?'Por encima':total.amount<goals.calories?'Por debajo':'Igual al valor')+' de referencia':'');
  const waterText=record.water==null?'Sin registro':format(record.water)+' ml'+(goals.water?' · '+(record.water>=goals.water?'Meta alcanzada':'Por debajo de la meta'):' registrados');
  return `<section class="card"><h2>Resumen del día</h2><p class="muted">${esc(pretty(key))}</p>
  <div class="review-grid">
    <article><h3>Peso</h3><p>${record.weight==null?'Sin pesaje':format(record.weight)+' kg'}${change==null?'':change===0?' · Igual que ayer':' · '+(change<0?'Bajó ':'Subió ')+format(Math.abs(change))+' kg frente a ayer'}</p></article>
    <article><h3>Agua</h3><p>${waterText}</p></article>
    <article><h3>Calorías</h3><p>${caloriesText}</p></article>
    <article><h3>Ejercicio</h3><p>${training.length?training.length+' actividad(es) registrada(s)':scheduled?'Rutina de ejemplo prevista · Sin actividad registrada':'Sin actividad registrada'}</p></article>
  </div><small>Revisa estos datos juntos. Para entender una variación de peso hace falta más contexto que el registro de un día.</small>
  <form id="day-observation" class="stack meal" data-date="${key}">
    ${dictationField('Observación del día',`<textarea name="observation" rows="2" maxlength="500" placeholder="Ejemplo: dormí menos o dejé el entrenamiento a medias.">${esc(record.observation)}</textarea>`)}
    <div><button class="primary">Guardar observación</button></div>
  </form></section>`;
}
function periodReport() {
  if(!state.reportRange) return '';
  const {start,end}=state.reportRange;
  const dates=[];
  for(let key=start;key<=end;key=shift(key,1)) dates.push(key);
  return `<section class="card"><h2>Registro del 1 al 16 de noviembre</h2><p class="muted">16 días ficticios. Abre un día para ver sus comidas, el agua y el peso.</p>
  <div class="fields">${dates.map(key=>{
    const entry=day(key);
    return `<article class="empty"><h3>${esc(pretty(key))}</h3><p>Menú ${esc(menuChoice(key))} · ${format(entry.weight)} kg · ${format(entry.water)} ml</p>${action('Abrir día','open-sample-day',key)}</article>`;
  }).join('')}</div></section>`;
}
function progress() {
  const current = day();
  const dates=reportDates();
  const compareStart=monday(reportComparison||shift(monday(selected),-7));
  const reference=reportRange==='compare'?datesBetween(compareStart,shift(compareStart,6)):[];

function openSampleWeek(sourceId, period = false) {
  const source = clients.find(item=>item.id===sourceId);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(source ? clientKey(source.id) : personalKey)) || {}; }
  catch { return notify('No se pudo leer la ficha de origen.'); }
  const id = (period?'sample-november':'sample-week')+(source?'-'+source.id:'');
  const example = clients.find(item=>item.id===id);
  if (example) {
    location.href=clientLink(id,'Progreso',example.reportDate);
    return;
  }
  const suffix = period ? 'Ejemplo del 1 al 16 de noviembre' : 'Semana de ejemplo';
  const name = source ? source.name+' · '+suffix : suffix;
  const first = period ? '2026-11-01' : monday(dateKey());
  const count = period ? 16 : 7;
  const next = blank();
  next.profile = {...saved.profile,name};
  next.profile.objective ||= 'Ejemplo: registrar las comidas, el agua y el entrenamiento durante una semana.';
  next.profile.habits ||= 'Ejemplo: tres comidas principales y una colación según el menú del día.';
  const baseline = { 'Cintura':104,'Pecho / tórax':109,'Brazo derecho':36,'Muslo derecho':59,'Cuello':40 };
  next.days[shift(first,-2)]={weight:95.7,measures:baseline};
  const choices=['B','A','C','B','A','C','D'];
  const weights=[95.4,95.2,95.5,95,94.9,94.8,94.9];
  const water=[1750,2000,1500,2250,1750,2000,1500];
  const resultDate=shift(first,period?count-1:5);
  if(period) next.reportRange={start:first,end:resultDate};
  const reminders=[
    {id:'sample-water',kind:'Agua',label:'Es hora de tomar un vaso de agua.',time:'09:00'},
    {id:'sample-checkin',kind:'Otro',label:'Registra el peso del día.',time:'07:00'}
  ];
  next.dailyReminders=reminders;
  for(let index=0;index<count;index++) {
    const key=shift(first,index);
    const slot=index%7;
    const choice=choices[slot];
    const weekday=parseDate(key).getDay();
    next.week[key]=choice;
    const entries=Object.fromEntries(Object.entries(menus[choice]).map(([meal,items])=>[meal,{
      status:'Comí lo planeado',
      items:items.map(item=>item.name==='Ensalada sin aderezo'?{...item,grams:110}:item)
    }]));
    const record={weight:Number((weights[slot]-Math.floor(index/7)*0.4).toFixed(1)),water:water[slot],entries,reminderAnswers:{
      'sample-water':slot===2?'No realizado':'Realizado','sample-checkin':'Realizado'
    }};
    next.days[key]=record;
    if(weekday===1) record.training={0:true};
    if(weekday===3) record.training={1:{alternative:'Bicicleta estática · 25 minutos'}};
    if(weekday===5) record.training={2:true};
    if(weekday===4) entries.Almuerzo={status:'Comí otra cosa',items:[food('Pollo cocido',170),food('Arroz cocido',140),food('Ensalada sin aderezo',120)]};
    if(weekday===6) {
      if(entries['Media tarde']) entries['Media tarde']={status:'Omitida',items:[]};
      record.measures={...baseline,'Cintura':103.5-Math.floor(index/7)*0.5,'Pecho / tórax':108.5};
    }
  }
  next.notes=[
    {date:resultDate,type:'Cambio de plan',text:'Registrar como alternativa un almuerzo fácil de llevar.',reason:'El jueves el cliente comió fuera de casa.'},
    {date:shift(first,2),type:'Entrenamiento',text:'Registró bicicleta estática como ejercicio realizado.',reason:'La máquina de la rutina estaba ocupada.'},
    {date:first,type:'Observación general',text:'Inicio de la semana ficticia.',reason:'Revisar los registros el sábado.'}
  ];
  try {localStorage.setItem(clientKey(id),JSON.stringify(next));}
  catch {return notify('El navegador no pudo guardar la semana de ejemplo.');}
  if(persistClients([...clients,{id,name,archived:false,reportDate:resultDate,sample:true}])) {
    location.href=clientLink(id,'Progreso',resultDate);
  }
}

async function passwordHash(password,salt) {
  const encoder=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:encoder.encode(salt),iterations:210000,hash:'SHA-256'},key,256);
  return Array.from(new Uint8Array(bits),byte=>byte.toString(16).padStart(2,'0')).join('');
}
async function saveAccess(username,password,role,clientId) {
  const salt=crypto.randomUUID();
  const hash=await passwordHash(password,salt);
  const latest=readAccounts();
  const existing=latest[username];
  if(Object.hasOwn(latest,username) && !(role==='client'&&existing.role==='client'&&existing.clientId===clientId)) {
    return false;
  }
  if(role==='admin' && Object.values(latest).some(user=>user.role==='admin')) return false;
  const next=Object.fromEntries(Object.entries(latest).filter(([,user])=>role!=='client'||user.clientId!==clientId));
  next[username]={username,role,clientId,salt,hash};
  localStorage.setItem(accessKey,JSON.stringify(next));
  accounts=next;
  return true;
}
async function handleAccessForm(form,data) {
  const status=form.querySelector('[data-access-status]');
  const feedback=message=>{
    if(status) {status.textContent=message;status.hidden=false;}
    else notify(message);
  };
  if(status) status.hidden=true;
  const username=String(data.get('username')||'').trim().toLowerCase();
  const password=String(data.get('password')||'');
  if(!/^[a-z0-9._@+-]{3,64}$/.test(username)) return feedback('Escribe un usuario de 3 a 64 caracteres sin espacios.');
  if(password.length<8) return feedback('La contraseña debe tener al menos 8 caracteres.');
  const submit=form.querySelector('button[type=submit], button:not([type])');
  if(submit) submit.disabled=true;
  try {
    if(form.id==='client-access') {
      if(account?.role!=='admin'||!clients.some(item=>item.id===form.dataset.id)) return feedback('No se encontró una ficha de cliente disponible.');
      if(!await saveAccess(username,password,'client',form.dataset.id)) return feedback('Ese usuario ya está en uso.');
      dialog.close();
      render();
      notify('Se guardaron los datos de acceso del cliente.');
      return;
    }
    accounts=readAccounts();
    if(!Object.values(accounts).some(user=>user.role==='admin')) {
      if(!await saveAccess(username,password,'admin',null)) return feedback('Ya existe un acceso de administrador. Vuelve a intentarlo.');
    }
    const user=Object.hasOwn(accounts,username)?accounts[username]:null;
    if(!user || await passwordHash(password,user.salt)!==user.hash) return feedback('Usuario o contraseña incorrectos.');
    if(user.role==='client'&&!clients.some(item=>item.id===user.clientId&&!item.archived)) return feedback('Este acceso está archivado o ya no está disponible.');
    sessionStorage.setItem(sessionKey,username);
    location.replace(clientLink(user.clientId,user.role==='admin'?'Clientes':'Hoy'));
  } catch {feedback(form.id==='client-access'?'No se pudo guardar el acceso en este navegador.':'No se pudo completar el acceso en este navegador.');}
  finally {if(submit) submit.disabled=false;}
}

function render() {
  if(activeDictation) {
    activeDictation.recognition.abort();
    activeDictation=undefined;
  }
  const version = ++renderVersion;
  main.dataset.page = page;
  const visibleSections=sections.filter(section=>account?.role!=='client'||section!=='Clientes');
  nav.innerHTML = visibleSections.map(section=>`<button type="button" data-action="page" data-arg="${section}" aria-current="${section===page}">${section}</button>`).join('');
  const scope = client ? `<div class="client-context">Ficha de <strong>${esc(client.name)}</strong> · ${account?.role==='client'?'Acceso de cliente':`<a href="${esc(clientLink(null,'Clientes'))}">Volver a Clientes</a>${client.sample?' · Registros ficticios':' · '+action('Simular una semana','sample-week',client.id)}`}</div>` : '';
  main.innerHTML = scope+({Hoy:today,Programa:programme,Progreso:progress,Ficha:profile,Clientes:clientPanel,Ayuda:help})[page]();
  if (main.querySelector('#selected')) main.querySelector('#selected').value=selected;
  if (page==='Progreso') loadPhotos(version).catch(()=>notify('No se pudieron abrir las fotos locales.'));
}

function dictate(button) {
  if (activeDictation?.button===button) {
    activeDictation.recognition.stop();
    return;
  }
  if (activeDictation) {
    notify('Detén el dictado actual para usar otro campo.');
    return;
  }
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    notify('Este navegador no admite el botón Dictar. En el celular, puedes usar el micrófono de tu teclado.');
    return;
  }
  const target=button.closest('.dictation-field').querySelector('textarea, input');
  const recognition=new Recognition();
  recognition.lang='es-EC';
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.onresult=event=>{
    if(activeDictation?.recognition!==recognition) return;
    for(let index=event.resultIndex;index<event.results.length;index++) {
      const result=event.results[index];
      if(!result.isFinal) continue;
      const transcript=result[0].transcript.trim();
      if(!transcript) continue;
      const combined=target.value+(target.value && !/\s$/.test(target.value)?' ':'')+transcript;
      if(target.maxLength>=0 && combined.length>target.maxLength) {
        notify('El mensaje alcanzó el límite de caracteres. Puedes acortarlo antes de seguir dictando.');
        recognition.stop();
        return;
      }
      target.value=combined;
    }
  };
  recognition.onerror=event=>{
    if(event.error==='aborted') return;
    notify(event.error==='not-allowed' || event.error==='service-not-allowed'
      ? 'Permite el acceso al micrófono en el navegador para dictar.'
      : event.error==='no-speech' ? 'No se detectó voz. Pulsa Dictar y vuelve a intentarlo.'
      : 'El dictado no está disponible ahora. Puedes usar el micrófono del teclado.');
  };
  recognition.onend=()=>{
    if(activeDictation?.recognition===recognition) activeDictation=undefined;
    button.setAttribute('aria-pressed','false');
    button.querySelector('span').textContent='Dictar';
  };
  try {
    recognition.start();
    activeDictation={button,recognition};
    button.setAttribute('aria-pressed','true');
    button.querySelector('span').textContent='Detener';
  } catch {
    notify('No se pudo activar el micrófono. Puedes usar el dictado del teclado.');
  }
}

let dbPromise;
function database() {
  return dbPromise ??= new Promise((resolve,reject)=>{
    const request=indexedDB.open(photosKey(client?.id),1);
    request.onupgradeneeded=()=>request.result.createObjectStore('photos');
    request.onsuccess=()=>{request.result.onversionchange=()=>{request.result.close();dbPromise=undefined;};resolve(request.result);};
    request.onerror=()=>reject(request.error);
  });
}
async function photoTransaction(mode, handler) {
  const db=await database();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('photos',mode);
    const request=handler(tx.objectStore('photos'));
    tx.oncomplete=()=>resolve(request.result);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  });
}
async function loadPhotos(version) {
  const dates = [...new Set([selected,comparison].filter(Boolean))];
  await Promise.all(poses.map(async (_,index)=>{
    const images=await Promise.all(dates.map(key=>photoTransaction('readonly',store=>store.get(key+':'+index))));
    if(version!==renderVersion) return;
    const slot=document.querySelector('#photo-'+index);
    images.forEach((blob,i)=>{
      if(!blob) {const label=document.createElement('small');label.textContent=pretty(dates[i])+': sin foto';slot.append(label);return;}
      const label=document.createElement('small');label.textContent=pretty(dates[i]);
      const image=document.createElement('img');
      image.className='thumb';image.alt=poses[index]+' · '+pretty(dates[i]);
      image.src=URL.createObjectURL(blob);
      image.onload=image.onerror=()=>URL.revokeObjectURL(image.src);
      slot.append(label,image);
      const remove=document.createElement('button');
      remove.type='button';remove.textContent='Quitar foto';remove.dataset.action='remove-photo';remove.dataset.arg=dates[i]+':'+index;
      slot.append(remove);
    });
  }));
}
document.addEventListener('input',event=>{
  if(event.target.id!=='client-search') return;
  clientFilter=event.target.value;

});
document.addEventListener('change',async event=>{
  const el=event.target;
  if(el.matches('#voice-preview select')) {
    el.form.elements.message.value=reminderMessage(el.value);
  }
  if(el.id==='selected' && el.value) {selected=el.value;render();}
  if(el.id==='report-range') {reportRange=el.value;render();}
  if(el.id==='report-comparison') {reportComparison=el.value;render();}
  if(el.id==='comparison') {comparison=el.value;render();}
  if(el.id==='menu'||el.dataset.menuDate) {state.week[el.dataset.menuDate || selected]=el.value;update('Menú actualizado.');}
  if(el.matches('[data-name]')) el.closest('.food').querySelector('[data-density]').value=catalogue[el.value] ?? '';
  if(el.dataset.pose && el.files.length) {
    const file=el.files[0];
    const key=selected+':'+el.dataset.pose;
    if(!file.type.startsWith('image/')||file.type==='image/svg+xml') return notify('Selecciona una foto.');
    try {
      const bitmap=await createImageBitmap(file);
      const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
      canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
      bitmap.close();
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.86));
      if(!blob) throw new Error('Sin imagen');
      await photoTransaction('readwrite',store=>store.put(blob,key));
      render();notify('Foto guardada.');
    } catch {notify('No se pudo guardar la foto. Prueba con JPG o PNG.');}
  }
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  const form=event.target;
  const data=new FormData(form);
  if(form.id==='login-form'||form.id==='client-access') {
    handleAccessForm(form,data);
    return;
  }
  if(!account) return;
  switch(form.id) {
    case 'voice-preview': return speak(data.get('message'));
    case 'day-observation':
      editDay(form.dataset.date).observation=data.get('observation').trim();
      break;
    case 'report-goals':
      state.reportGoals={water:number(data.get('water')),calories:number(data.get('calories'))};
      break;
    case 'weight': editDay().weight=number(data.get('weight'));break;
    case 'measures': editDay().measures=Object.fromEntries(measured.map((name,i)=>[name,number(data.get('measure-'+i))]));break;
    case 'new-client': {
      if(account.role!=='admin'||form.dataset.saving==='true') return;
      const name=data.get('name').trim();
      if(!name) return notify('Escribe el nombre del cliente.');
      const submit=form.querySelector('button[type=submit]');
      const item={id:crypto.randomUUID(),name,archived:false};
      form.dataset.saving='true';
      submit.disabled=true;
      if(!persistClients([...clients,item])) {
        delete form.dataset.saving;
        submit.disabled=false;
        return;
      }
      dialog.close();
      const previousPhotos=dbPromise;
      dbPromise=undefined;
      previousPhotos?.then(db=>db.close()).catch(()=>{});
      client=item;
      storageKey=clientKey(item.id);
      state=blank();
      state.profile={name};
      selected=dateKey();
      comparison='';
      page='Ficha';
      history.replaceState(null,'',clientLink(item.id,'Ficha'));
      update('Ficha de '+name+' creada.');
      window.scrollTo(0,0);
      return;
    }
    case 'profile': {
      const profile=Object.fromEntries(data);
      if(client) {
        const name=profile.name.trim();
        if(!name) return notify('Escribe el nombre del cliente.');
        if(!persistClients(clients.map(item=>item.id===client.id?{...item,name}:item))) return;
        client.name=name;
      }
      state.profile=profile;
      break;
    }
    case 'note-edit':
    case 'note': {
      const text=data.get('text').trim();
      if(!text) return notify('Escribe una nota.');
      const note={...Object.fromEntries(data),text};
      if(form.id==='note-edit') {
        const existing=state.notes[Number(form.dataset.index)];
        if(!existing) return notify('Esa nota ya no está disponible.');
        Object.assign(existing,note);
        dialog.close();
      } else {
        state.notes.unshift({...note,date:dateKey()});
      }
      break;
    }
    case 'daily-reminder-edit':
    case 'daily-reminder': {
      const item=Object.fromEntries(data);
      item.label=item.label.trim();
      if (!item.label) return notify('Escribe el mensaje del aviso.');
      if(form.id==='daily-reminder-edit') {
        const existing=state.dailyReminders?.find(reminder=>reminder.id===form.dataset.id);
        if(!existing) return notify('Ese recordatorio ya no está disponible.');
        if(existing.time!==item.time) delete existing.lastShown;
        Object.assign(existing,item);
        dialog.close();
      } else {
        item.id=String(Date.now())+'-'+Math.random().toString(36).slice(2);
        (state.dailyReminders??=[]).push(item);
      }
      state.dailyReminders.sort((a,b)=>a.time.localeCompare(b.time));
      break;
    }
    case 'meal-reminder': {
      const reminder = Object.fromEntries(data);
      if (new Date(reminder.date+'T'+reminder.time) <= new Date()) return notify('Elige una fecha y hora futuras.');
      state.mealReminder=reminder;
      break;
    }
    case 'reminder':state.reminder=data.get('time');break;
    case 'training-alternative': {
      const alternative=data.get('exercise').trim();
      if(!alternative) return notify('Escribe el ejercicio que hiciste.');
      (editDay(form.dataset.date).training??={})[form.dataset.index]={alternative};
      dialog.close();
      break;
    }
    case 'water-form':editDay().water=number(data.get('water'));dialog.close();break;
    case 'meal-form': {
      const items=[...form.querySelectorAll('.food')].map(row=>({name:row.querySelector('[data-name]').value.trim(),grams:number(row.querySelector('[data-grams]').value),density:number(row.querySelector('[data-density]').value)})).filter(item=>item.name);
      if(!items.length) return notify('Añade un alimento o marca la comida como omitida.');
      return recordMeal(form.dataset.meal,'Comí otra cosa',items);
    }
    default: return;
  }
  update('Registro guardado.');
});
document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');
  if(!button) return;
  const {action:command,arg}=button.dataset;
  if(command==='toggle-password') {
    const input=button.closest('.password-field').querySelector('input');
    const visible=input.type==='password';
    input.type=visible?'text':'password';
    button.textContent=visible?'Ocultar':'Mostrar';
    button.setAttribute('aria-pressed',String(visible));
    return;
  }
  if(!account) return;
  switch(command) {
    case 'logout': {
      sessionStorage.removeItem(sessionKey);
      account=undefined;
      app.hidden=true;
      intro.hidden=true;
      login.hidden=true;
      notice.hidden=true;
      clearTimeout(introTimer);
      clearInterval(videoTimer);
      activeDictation?.recognition.abort();
      if(dialog.open) dialog.close();
      window.speechSynthesis?.cancel();
      if(window.opener || window.history.length===1) window.close();
      if(!window.closed) location.replace('about:blank');
      break;
    }
    case 'client-access': {
      if(account.role!=='admin') break;
      const item=clients.find(item=>item.id===arg);
      if(!item) break;
      const existing=Object.values(accounts).find(user=>user.clientId===arg);
      openDialog(`<form id="client-access" class="stack" data-id="${esc(arg)}" novalidate><h2>${existing?'Cambiar acceso del cliente':'Crear acceso para el cliente'}</h2><p><strong>${esc(item.name)}</strong></p><p>El cliente usará estos datos en la pantalla <strong>Iniciar sesión</strong>.</p>
        <label>Usuario<input name="username" autocomplete="off" maxlength="64" value="${esc(existing?.username)}" required></label>
        ${passwordField('new-password')}<small>Escribe una contraseña de al menos 8 caracteres.</small>
        <p data-access-status class="access-status" role="alert" hidden></p>
        <div class="row">${action('Cancelar','close')}<button class="primary" type="submit">Guardar acceso</button></div>
      </form>`);
      break;
    }
    case 'page':if(arg==='Clientes'&&account.role!=='admin') break;page=arg;render();break;
    case 'report-day':selected=arg;reportRange='day';render();window.scrollTo(0,0);break;
    case 'open-sample-day':selected=arg;page='Hoy';render();window.scrollTo(0,0);break;
    case 'sample-week':openSampleWeek(arg);break;
    case 'sample-period':openSampleWeek(arg,true);break;
    case 'new-client':
      openDialog(`<form id="new-client" class="stack"><h2>Añadir cliente</h2><label>Nombre completo<input name="name" maxlength="140" required></label><div class="row">${action('Cancelar','close')}<button class="primary" type="submit">Crear ficha</button></div></form>`);
      break;
    case 'archive-client':
      if(persistClients(clients.map(item=>item.id===arg?{...item,archived:!item.archived}:item))) render();
      break;
    case 'delete-client': {
      const item=clients.find(item=>item.id===arg);
      if(!item || !confirm('¿Eliminar definitivamente la ficha de '+item.name+' y sus registros y fotos de este navegador?')) break;
      try {
        if(client?.id===arg && dbPromise) {(await dbPromise).close();dbPromise=undefined;}
        await new Promise((resolve,reject)=>{
          const request=indexedDB.deleteDatabase(photosKey(arg));
          request.onsuccess=resolve;
          request.onerror=()=>reject(request.error);
          request.onblocked=()=>reject(new Error('Ficha abierta'));
        });
        if(!persistClients(clients.filter(item=>item.id!==arg))) break;
        localStorage.removeItem(clientKey(arg));
        if(client?.id===arg) location.href=clientLink(null,'Clientes');
        else {render();notify('Cliente eliminado.');}
      } catch {notify('No se pudo eliminar la ficha. Cierra otras pestañas de ese cliente y vuelve a intentar.');}
      break;
    }
    case 'note-edit': {
      const note=state.notes[Number(arg)];
      if(!note) break;
      openDialog(`<form id="note-edit" class="stack" data-index="${esc(arg)}"><h2>Editar nota</h2>
        <label>Tipo<select name="type">${noteTypeOptions(note.type)}</select></label>
        ${dictationField('Nota o cambio',`<textarea name="text" required>${esc(note.text)}</textarea>`)}
        ${dictationField('Motivo o próximo paso',`<input name="reason" value="${esc(note.reason)}">`)}
        <div class="row">${action('Cancelar','close')}<button class="primary">Guardar cambios</button></div></form>`);
      break;
    }
    case 'note-delete': {
      const index=Number(arg);
      if(!state.notes[index] || !confirm('¿Eliminar esta nota del historial?')) break;
      state.notes.splice(index,1);
      update('Nota eliminada.');
      break;
    }
    case 'dictate':dictate(button);break;
    case 'daily-edit': {
      const item=state.dailyReminders?.find(item=>item.id===arg);
      if (!item) break;
      openDialog(`<form id="daily-reminder-edit" class="stack" data-id="${esc(item.id)}"><h2>Editar recordatorio</h2>
        <label>Tipo<select name="kind">${['Medicamento','Gotas','Agua','Otro'].map(kind=>`<option ${kind===item.kind?'selected':''}>${kind}</option>`).join('')}</select></label>
        ${dictationField('Qué debe decir',`<input name="label" required maxlength="180" value="${esc(item.label)}">`)}
        <label>Hora<input name="time" type="time" required value="${esc(item.time)}"></label>
        <div class="row">${action('Cancelar','close')}<button class="primary">Guardar cambios</button></div></form>`);
      break;
    }
    case 'daily-test': {
      const item=state.dailyReminders?.find(item=>item.id===arg);
      if(item) showDailyAlert(item,dateKey(),true);
      break;
    }
    case 'daily-delete':
      state.dailyReminders=state.dailyReminders.filter(item=>item.id!==arg);
      update('Horario quitado.');
      break;
    case 'daily-answer': {
      const form=dialog.querySelector('#daily-alert');
      if(form.dataset.test==='false') {
        const answers=(editDay(form.dataset.date).reminderAnswers??={});
        answers[form.dataset.id]=arg;
        save();
      }
      dialog.close();
      notify(form.dataset.test==='true'?'Respuesta de prueba: '+arg+'.':'Respuesta guardada: '+arg+'.');
      break;
    }
    case 'intro': if(account.role==='admin') showIntro(); break;
    case 'speak': showMealAlert(Object.keys(plan())[0] || 'Desayuno'); break;
    case 'preview-confirm': {
      const meal = dialog.querySelector('[name=meal]').value;
      if (plan()[meal]) recordMeal(meal,'Comí lo planeado',plan()[meal]);
      else mealDialog(meal);
      break;
    }
    case 'preview-change': mealDialog(dialog.querySelector('[name=meal]').value);break;
    case 'water':editDay().water=(day().water||0)+Number(arg);update('Agua registrada.');break;
    case 'water-edit':openDialog(`<form id="water-form" class="stack"><h2>Agua del día</h2><label>Total en ml<input name="water" type="number" min="0" step="1" value="${day().water||0}" required></label><div class="row">${action('Cerrar','close')}<button class="primary">Guardar</button></div></form>`);break;
    case 'meal':mealDialog(arg);break;
    case 'confirm':recordMeal(arg,'Comí lo planeado',plan()[arg]);break;
    case 'skip':recordMeal(arg,'Omitida',[]);break;
    case 'close':dialog.close();break;
    case 'ingredient':dialog.querySelector('#items').insertAdjacentHTML('beforeend',foodRow(food('',null)));break;
    case 'remove':button.closest('.food').remove();break;
    case 'remove-photo':
      if(!confirm('¿Quitar esta foto del registro local?')) break;
      try {await photoTransaction('readwrite',store=>store.delete(arg));render();notify('Foto quitada.');}
      catch {notify('No se pudo quitar la foto.');}
      break;
    case 'training-alternative': {
      const routine=routines[Number(arg)];
      if(!routine) break;
      const alternative=day().training?.[arg]?.alternative;
      openDialog(`<form id="training-alternative" class="stack" data-index="${esc(arg)}" data-date="${selected}">
        <h2>Registrar otro ejercicio</h2><p>Ejercicio programado: ${esc(routine[1])}.</p>
        <label>Qué ejercicio hiciste<input name="exercise" maxlength="140" value="${esc(alternative)}" required></label>
        <div class="row">${action('Cancelar','close')}<button class="primary">Guardar como realizado</button></div>
      </form>`);
      break;
    }
    case 'training': {
      const record=editDay();
      (record.training??={})[arg]=!record.training?.[arg];
      update();
      break;
    }
    case 'timer': {
      clearInterval(videoTimer);
      const end=Date.now()+Number(arg)*1000;
      const tick=()=>{
        const seconds=Math.max(0,Math.ceil((end-Date.now())/1000));
        const output=document.querySelector('#timer');
        if(output) output.textContent='Descanso: '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
        if(seconds===0) {clearInterval(videoTimer);speak('Terminó el descanso.');}
      };
      videoTimer=setInterval(tick,500);tick();
      break;
    }
  }
});
function showMealAlert(name, scheduled = false) {
      const message = reminderMessage(name);
      openDialog(`<form id="voice-preview" class="stack" data-meal="${esc(name)}"><div class="row"><span class="brand-mark" aria-hidden="true"></span><h2>${scheduled?"Aviso de comida":"Prueba de aviso hablado"}</h2></div><label>Comida<select name="meal">${Object.keys(meals).map(meal=>`<option ${meal===name?'selected':''}>${meal}</option>`).join('')}</select></label><label>Mensaje que quieres escuchar<textarea name="message" rows="6" required>${esc(message)}</textarea></label><button class="primary">▶ Escuchar mensaje</button><div class="row">${action('✓ Comí lo planeado','preview-confirm')}${action('✕ Cambiar u omitir','preview-change')}${action('Cerrar','close')}</div></form>`);
      speak(message);
}
function showDailyAlert(item,key,test=false) {
  const name=state.profile.name?.trim().split(/\s+/)[0];
  const hour=new Date().getHours();
  const greeting=hour<12?'Buenos días':hour<19?'Buenas tardes':'Buenas noches';
  const message=greeting+(name?', '+name:'')+'. Te recuerdo que tienes este aviso programado: '+item.label+'. Cuando puedas, marca el visto si lo hiciste, o la equis si quedó pendiente.';
  openDialog(`<div id="daily-alert" class="stack" data-id="${esc(item.id)}" data-date="${key}" data-test="${test}"><h2>${test?'Prueba de voz':esc(item.kind)}</h2><p>${esc(message)}</p><div class="row">${action('✓ Lo hice','daily-answer','Realizado','primary')}${action('✕ No lo hice','daily-answer','No realizado')}${action('Cerrar','close')}</div></div>`);
  speak(message);
}
function checkReminders(){
  const now=new Date();
  const time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if (!account || dialog.open || !intro.hidden) return;
  const key=dateKey(now);
  const daily=state.dailyReminders?.find(item=>item.time===time && item.lastShown!==key);
  if (daily) {
    daily.lastShown=key;
    save();
    showDailyAlert(daily,key);
    return;
  }
  if(time===state.reminder&&state.lastWaterReminder!==dateKey(now)) {
    state.lastWaterReminder=dateKey(now);
    save();
    speak('Es hora de tomar agua. Registra tu vaso en la app.');
  }
  const reminder = state.mealReminder;
  if (!reminder || reminder.fired || reminder.date !== dateKey(now) || time < reminder.time || dialog.open || !intro.hidden) return;
  reminder.fired = true;
  save();
  selected = reminder.date;
  page = 'Hoy';
  render();
  showMealAlert(reminder.meal,true);
}
if(!closedScreen && account?.role==='client') {
  const active=clients.some(item=>item.id===account.clientId&&!item.archived);
  if(!active) {
    sessionStorage.removeItem(sessionKey);
    account=undefined;
  } else if(client?.id!==account.clientId || page==='Clientes') {
    location.replace(clientLink(account.clientId,'Hoy'));
  }
}
if(closedScreen) {
  app.hidden=true;
  login.hidden=true;
  location.replace('about:blank');
} else {
  if(account && (account.role==='admin'||(client?.id===account.clientId && page!=='Clientes'))) {
    app.hidden=false;
    document.querySelector('.account-actions [data-action=intro]').hidden=account.role!=='admin';
    document.querySelector('.account-actions [data-action=logout]').setAttribute('aria-label',account.role==='admin'?'Cerrar sesión de administrador':'Cerrar sesión de cliente');
    render();
    setInterval(checkReminders,5000);
  } else if(!account) {
    loginScreen();
  }
  try {
    if (!account || !sessionStorage.getItem('pulso-intro-shown')) {
      sessionStorage.setItem('pulso-intro-shown','1');
      showIntro();
    }
  } catch {
    if(!account || !params.has('cliente')) showIntro();
  }
}
</script>
</body>
</html>
